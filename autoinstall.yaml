#cloud-config
autoinstall:
  version: 1

  identity:
    hostname: ubuntu-server
    username: saintfadeogba
    # Replace with a SHA-512 password hash produced by: mkpasswd --method=SHA-512
    password: "$6$y2RMmH.0WtYDRDqL$stdBS4HTKhIPdBCQq04HLai8QIhZ51MFCK3cNUqez486CgAS/mv/4JEcTg414BweOqlGMYDZ2bda.B6ApwPut1"

  locale: en_US.UTF-8
  keyboard:
    layout: us

  storage:
    layout:
      name: direct

  ssh:
    install-server: true

  packages:
    - vim
    - curl
    - git
    - htop

  user-data: |
    #cloud-config
    disable_root: true
    ssh_pwauth: false
    users:
      - name: deploy
        sudo: ALL=(ALL) NOPASSWD:ALL
        shell: /bin/bash
        lock_passwd: false
        passwd: "$6$y2RMmH.0WtYDRDqL$stdBS4HTKhIPdBCQq04HLai8QIhZ51MFCK3cNUqez486CgAS/mv/4JEcTg414BweOqlGMYDZ2bda.B6ApwPut1"
        ssh_authorized_keys:
          - "ssh-rsa AAAA... replace_with_your_pubkey"

  late-commands:
    # make apt operations tolerant to non-critical failures
    - curtin in-target -- apt-get update || true
    - curtin in-target -- apt-get -y upgrade || true

    # ensure user ssh dir and authorized_keys (if pulling from remote, validate source)
    - curtin in-target -- mkdir -p /home/deploy/.ssh || true
    - curtin in-target -- chown -R deploy:deploy /home/deploy/.ssh || true
    - curtin in-target -- chmod 700 /home/deploy/.ssh || true
    - curtin in-target -- chmod 600 /home/deploy/.ssh/authorized_keys || true

    # idempotent SSH enable/start
    - curtin in-target -- systemctl enable ssh || true
    - curtin in-target -- systemctl start ssh || true
